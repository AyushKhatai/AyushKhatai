<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" width="460" height="215">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090410" />
      <stop offset="50%" stop-color="#140722" />
      <stop offset="100%" stop-color="#080310" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="card-dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#a855f7" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #d946ef;
    }
    .label {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #e9d5ff;
    }
    .value {
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #f5d0fe;
    }
    .accent-val {
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #fbbf24;
    }
    .protocol-tag {
      font-family: 'Consolas', monospace;
      font-size: 10px;
      fill: #c084fc;
      letter-spacing: 1.5px;
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Card Background -->
  <rect width="460" height="215" rx="10" fill="url(#card-bg)" />
  <rect width="460" height="215" rx="10" fill="url(#card-dots)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="458" height="213" rx="9" fill="none" stroke="#7e22ce" stroke-width="1.5" stroke-opacity="0.7" />
  <rect x="5" y="5" width="450" height="205" rx="7" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="6 4" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#d946ef" stroke-width="2" />
  <path d="M 448 24 L 448 12 L 436 12" fill="none" stroke="#d946ef" stroke-width="2" />
  <path d="M 12 191 L 12 203 L 24 203" fill="none" stroke="#d946ef" stroke-width="2" />
  <path d="M 448 191 L 448 203 L 436 203" fill="none" stroke="#d946ef" stroke-width="2" />

  <!-- Header Section -->
  <g transform="translate(24, 32)">
    <!-- Icon / Symbol -->
    <polygon points="0,-8 7,0 0,8 -7,0" fill="#d946ef" filter="url(#glow-filter)" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    
    <text x="16" y="4" class="title" filter="url(#glow-filter)">COMBAT STATS</text>
    <text x="390" y="4" class="protocol-tag" text-anchor="end">// AGENT 11</text>
    <line x1="0" y1="12" x2="412" y2="12" stroke="url(#purple-grad)" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Stats Rows -->
  <g transform="translate(24, 68)">
    <!-- Row 1: Rank -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="0" r="3" fill="#a855f7" />
      <text x="16" y="4" class="label">Combat Rank</text>
      <text x="412" y="4" class="accent-val" text-anchor="end">✦ RADIANT DUELIST</text>
    </g>

    <!-- Row 2: Specialization -->
    <g transform="translate(0, 28)">
      <circle cx="4" cy="0" r="3" fill="#a855f7" />
      <text x="16" y="4" class="label">Primary Domain</text>
      <text x="412" y="4" class="value" text-anchor="end">AI &amp; FULL-STACK</text>
    </g>

    <!-- Row 3: Multi-Agent AI -->
    <g transform="translate(0, 56)">
      <circle cx="4" cy="0" r="3" fill="#d946ef" />
      <text x="16" y="4" class="label">Multi-Agent Systems</text>
      <text x="412" y="4" class="value" text-anchor="end" fill="#d946ef">ACTIVE (HireMind)</text>
    </g>

    <!-- Row 4: Empress Status -->
    <g transform="translate(0, 84)">
      <circle cx="4" cy="0" r="3" fill="#a855f7" />
      <text x="16" y="4" class="label">Empress Mode</text>
      <text x="412" y="4" class="accent-val" text-anchor="end">OVERDRIVE (100%)</text>
    </g>

    <!-- Row 5: Deployments / Repos -->
    <g transform="translate(0, 112)">
      <circle cx="4" cy="0" r="3" fill="#d946ef" />
      <text x="16" y="4" class="label">Public Repositories</text>
      <text x="412" y="4" class="value" text-anchor="end">4+ ACTIVE REPOS</text>
    </g>
  </g>
</svg>
