<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 195" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="contrib-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090410" />
      <stop offset="50%" stop-color="#140624" />
      <stop offset="100%" stop-color="#080310" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glow-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="contrib-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="contrib-dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#a855f7" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .header-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #d946ef;
    }
    .stat-num {
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 26px;
      font-weight: 900;
      fill: #ffffff;
    }
    .stat-lbl {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e9d5ff;
      letter-spacing: 0.5px;
    }
    .stat-sub {
      font-family: 'Consolas', monospace;
      font-size: 10.5px;
      fill: #c084fc;
      letter-spacing: 1px;
    }
    .protocol-text {
      font-family: 'Consolas', monospace;
      font-size: 10.5px;
      fill: #c084fc;
      letter-spacing: 1.5px;
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Card Background -->
  <rect width="940" height="195" rx="10" fill="url(#contrib-bg)" />
  <rect width="940" height="195" rx="10" fill="url(#contrib-dots)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="938" height="193" rx="9" fill="none" stroke="#7e22ce" stroke-width="1.5" stroke-opacity="0.7" />
  <rect x="5" y="5" width="930" height="185" rx="7" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="6 4" />

  <!-- Tactical Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#d946ef" stroke-width="2" />
  <path d="M 928 24 L 928 12 L 916 12" fill="none" stroke="#d946ef" stroke-width="2" />
  <path d="M 12 171 L 12 183 L 24 183" fill="none" stroke="#d946ef" stroke-width="2" />
  <path d="M 928 171 L 928 183 L 916 183" fill="none" stroke="#d946ef" stroke-width="2" />

  <!-- Header Section -->
  <g transform="translate(24, 30)">
    <polygon points="0,-8 7,0 0,8 -7,0" fill="#d946ef" filter="url(#contrib-glow)" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    <text x="16" y="4" class="header-title" filter="url(#contrib-glow)">RADIANT CONTRIBUTION &amp; STREAK METRICS</text>
    <text x="892" y="4" class="protocol-text" text-anchor="end">// ACTIVITY DISPATCH</text>
    <line x1="0" y1="12" x2="892" y2="12" stroke="url(#glow-magenta)" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- 4 Metrics Columns -->
  <g transform="translate(40, 72)">
    <!-- Metric 1: Total Contributions -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="95" rx="8" fill="#140826" stroke="#7e22ce" stroke-width="1" />
      <circle cx="20" cy="22" r="4" fill="#d946ef" class="pulse-dot" />
      <text x="32" y="26" class="stat-lbl">TOTAL HARVEST</text>
      <text x="20" y="60" class="stat-num" fill="#f5d0fe">100%</text>
      <text x="20" y="80" class="stat-sub">ACTIVE REPOSITORY LOGS</text>
    </g>

    <!-- Metric 2: Current Streak -->
    <g transform="translate(225, 0)">
      <rect x="0" y="0" width="190" height="95" rx="8" fill="#140826" stroke="#7e22ce" stroke-width="1" />
      <circle cx="20" cy="22" r="4" fill="#fbbf24" class="pulse-dot" />
      <text x="32" y="26" class="stat-lbl">CURRENT STREAK</text>
      <text x="20" y="60" class="stat-num" fill="url(#glow-gold)">DAILY</text>
      <text x="20" y="80" class="stat-sub">ACTIVE SPRINT CYCLE</text>
    </g>

    <!-- Metric 3: Operations & Commits -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="190" height="95" rx="8" fill="#140826" stroke="#7e22ce" stroke-width="1" />
      <circle cx="20" cy="22" r="4" fill="#a855f7" class="pulse-dot" />
      <text x="32" y="26" class="stat-lbl">CODE OPERATIONS</text>
      <text x="20" y="60" class="stat-num" fill="#e9d5ff">PRODUCTION</text>
      <text x="20" y="80" class="stat-sub">CONTINUOUS DELIVERY</text>
    </g>

    <!-- Metric 4: Empress Status -->
    <g transform="translate(675, 0)">
      <rect x="0" y="0" width="190" height="95" rx="8" fill="#140826" stroke="#7e22ce" stroke-width="1" />
      <circle cx="20" cy="22" r="4" fill="#4ade80" class="pulse-dot" />
      <text x="32" y="26" class="stat-lbl">EMPRESS VELOCITY</text>
      <text x="20" y="60" class="stat-num" fill="#4ade80">MAX</text>
      <text x="20" y="80" class="stat-sub">RADIANT DUELIST STATUS</text>
    </g>
  </g>
</svg>
