<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 305" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090410" />
      <stop offset="50%" stop-color="#140624" />
      <stop offset="100%" stop-color="#080310" />
    </linearGradient>

    <!-- Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Area Gradient -->
    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090410" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="point-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="graph-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#a855f7" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #f5d0fe;
    }
    .axis-label {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #c084fc;
      letter-spacing: 0.5px;
    }
    .tick-label {
      font-family: 'Consolas', monospace;
      font-size: 10px;
      fill: #a855f7;
    }
    .date-label {
      font-family: 'Consolas', 'Segoe UI', monospace;
      font-size: 9.5px;
      fill: #c084fc;
    }
  </style>

  <!-- Background Base -->
  <rect width="850" height="305" rx="10" fill="url(#bg-grad)" />
  <rect width="850" height="305" rx="10" fill="url(#graph-dots)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="848" height="303" rx="9" fill="none" stroke="#7e22ce" stroke-width="1.5" stroke-opacity="0.7" />
  <rect x="5" y="5" width="840" height="295" rx="7" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="6 4" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#d946ef" stroke-width="2" />
  <path d="M 838 24 L 838 12 L 826 12" fill="none" stroke="#d946ef" stroke-width="2" />
  <path d="M 12 281 L 12 293 L 24 293" fill="none" stroke="#d946ef" stroke-width="2" />
  <path d="M 838 281 L 838 293 L 826 293" fill="none" stroke="#d946ef" stroke-width="2" />

  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" class="title" filter="url(#neon-glow)">
    Ayush Khatai's Contribution Graph
  </text>

  <!-- Y-Axis Label -->
  <text x="-135" y="24" transform="rotate(-90)" text-anchor="middle" class="axis-label">
    Contributions
  </text>

  <!-- Horizontal Grid Lines & Y-Ticks -->
  <g stroke="#2e1065" stroke-width="1" stroke-opacity="0.7" stroke-dasharray="3 3">
    <!-- 16 -->
    <line x1="60" y1="58" x2="800" y2="58" />
    <text x="50" y="62" text-anchor="end" class="tick-label">16</text>

    <!-- 14 -->
    <line x1="60" y1="77" x2="800" y2="77" />
    <text x="50" y="81" text-anchor="end" class="tick-label">14</text>

    <!-- 12 -->
    <line x1="60" y1="96" x2="800" y2="96" />
    <text x="50" y="100" text-anchor="end" class="tick-label">12</text>

    <!-- 10 -->
    <line x1="60" y1="115" x2="800" y2="115" />
    <text x="50" y="119" text-anchor="end" class="tick-label">10</text>

    <!-- 8 -->
    <line x1="60" y1="134" x2="800" y2="134" />
    <text x="50" y="138" text-anchor="end" class="tick-label">8</text>

    <!-- 6 -->
    <line x1="60" y1="153" x2="800" y2="153" />
    <text x="50" y="157" text-anchor="end" class="tick-label">6</text>

    <!-- 4 -->
    <line x1="60" y1="172" x2="800" y2="172" />
    <text x="50" y="176" text-anchor="end" class="tick-label">4</text>

    <!-- 2 -->
    <line x1="60" y1="191" x2="800" y2="191" />
    <text x="50" y="195" text-anchor="end" class="tick-label">2</text>

    <!-- 0 Solid Axis -->
    <line x1="60" y1="210" x2="800" y2="210" stroke="#7e22ce" stroke-width="1.2" stroke-dasharray="none" />
    <text x="50" y="214" text-anchor="end" class="tick-label">0</text>
  </g>

  <!-- Area Fill Under Spline Curve -->
  <path d="M 85 210
           C 105 210, 115 210, 122 210
           C 135 210, 145 185, 159 181
           C 173 177, 185 155, 196 148
           C 210 138, 222 68, 233 66
           C 244 64, 255 178, 270 181
           C 285 184, 295 181, 307 181
           C 320 181, 332 181, 344 181
           C 358 181, 370 210, 381 210
           C 395 210, 405 181, 418 181
           C 432 181, 442 210, 455 210
           C 470 210, 480 210, 492 210
           C 505 210, 515 210, 529 210
           C 542 210, 554 191, 566 191
           C 580 191, 590 210, 603 210
           C 618 210, 628 210, 640 210
           C 652 210, 665 80, 677 78
           C 690 76, 702 115, 714 110
           C 726 105, 738 72, 751 70
           C 765 68, 775 148, 788 153
           L 788 210 Z"
        fill="url(#area-grad)" />

  <!-- Smooth Activity Spline Curve -->
  <path d="M 85 210
           C 105 210, 115 210, 122 210
           C 135 210, 145 185, 159 181
           C 173 177, 185 155, 196 148
           C 210 138, 222 68, 233 66
           C 244 64, 255 178, 270 181
           C 285 184, 295 181, 307 181
           C 320 181, 332 181, 344 181
           C 358 181, 370 210, 381 210
           C 395 210, 405 181, 418 181
           C 432 181, 442 210, 455 210
           C 470 210, 480 210, 492 210
           C 505 210, 515 210, 529 210
           C 542 210, 554 191, 566 191
           C 580 191, 590 210, 603 210
           C 618 210, 628 210, 640 210
           C 652 210, 665 80, 677 78
           C 690 76, 702 115, 714 110
           C 726 105, 738 72, 751 70
           C 765 68, 775 148, 788 153"
        fill="none" stroke="url(#line-grad)" stroke-width="2.6" filter="url(#neon-glow)" />

  <!-- Data Point Circles (Pink outer + white center) -->
  <g filter="url(#point-glow)">
    <circle cx="85" cy="210" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="122" cy="210" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="159" cy="181" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="196" cy="148" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="233" cy="66" r="4.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="270" cy="181" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="307" cy="181" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="344" cy="181" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="381" cy="210" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="418" cy="181" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="455" cy="210" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="492" cy="210" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="529" cy="210" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="566" cy="191" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="603" cy="210" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="640" cy="210" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="677" cy="78" r="4.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="714" cy="110" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="751" cy="70" r="4.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="788" cy="153" r="3.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- Dates on X-Axis (Angled 45 deg) -->
  <g>
    <text x="85" y="222" transform="rotate(45, 85, 222)" class="date-label">Jul 28</text>
    <text x="122" y="222" transform="rotate(45, 122, 222)" class="date-label">Jul 30</text>
    <text x="159" y="222" transform="rotate(45, 159, 222)" class="date-label">Aug 01</text>
    <text x="196" y="222" transform="rotate(45, 196, 222)" class="date-label">Aug 03</text>
    <text x="233" y="222" transform="rotate(45, 233, 222)" class="date-label">Aug 05</text>
    <text x="270" y="222" transform="rotate(45, 270, 222)" class="date-label">Aug 07</text>
    <text x="307" y="222" transform="rotate(45, 307, 222)" class="date-label">Aug 09</text>
    <text x="344" y="222" transform="rotate(45, 344, 222)" class="date-label">Aug 11</text>
    <text x="381" y="222" transform="rotate(45, 381, 222)" class="date-label">Aug 13</text>
    <text x="418" y="222" transform="rotate(45, 418, 222)" class="date-label">Aug 15</text>
    <text x="455" y="222" transform="rotate(45, 455, 222)" class="date-label">Aug 17</text>
    <text x="492" y="222" transform="rotate(45, 492, 222)" class="date-label">Aug 19</text>
    <text x="529" y="222" transform="rotate(45, 529, 222)" class="date-label">Aug 21</text>
    <text x="566" y="222" transform="rotate(45, 566, 222)" class="date-label">Aug 23</text>
    <text x="603" y="222" transform="rotate(45, 603, 222)" class="date-label">Aug 25</text>
    <text x="640" y="222" transform="rotate(45, 640, 222)" class="date-label">Aug 27</text>
    <text x="677" y="222" transform="rotate(45, 677, 222)" class="date-label">Aug 29</text>
    <text x="714" y="222" transform="rotate(45, 714, 222)" class="date-label">Aug 31</text>
    <text x="751" y="222" transform="rotate(45, 751, 222)" class="date-label">Sep 02</text>
    <text x="788" y="222" transform="rotate(45, 788, 222)" class="date-label">Sep 04</text>
  </g>

  <!-- Dates Axis Label Bottom Center -->
  <text x="425" y="290" text-anchor="middle" class="axis-label">
    Dates
  </text>
</svg>
